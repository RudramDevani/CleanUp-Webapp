[build]
  command = "pip install -r requirements.txt && python build.py"
  publish = "dist"
[build.environment]
  PYTHON_VERSION = "3.11"
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
